[package]
name = "mediaflow-core"
version = "0.1.0"
edition = "2021"
authors = ["MediaFlow"]
description = "High-performance multi-threaded core engine for MediaFlow"

[dependencies]
rayon = "1.10"
walkdir = "2.5"
blake3 = "1.5"
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
