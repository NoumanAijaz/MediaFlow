name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test mediaflow-core (Rust)
        run: |
          cargo test --manifest-path mediaflow-core/Cargo.toml

      - name: Build mediaflow-core (Release)
        run: |
          cargo build --release --manifest-path mediaflow-core/Cargo.toml
          Copy-Item mediaflow-core/target/release/mediaflow-core.exe -Destination ./mediaflow-core.exe -Force

      - name: Run pytest test suite
        run: |
          pytest tests/ -v
